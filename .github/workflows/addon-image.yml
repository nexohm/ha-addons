# Compila l'add-on per ogni architettura e pubblica le immagini su ghcr.io.
# Con le immagini pronte, presso il cliente l'installazione dura secondi invece che minuti.
# La versione viene letta da installer_agent/config.yaml: per pubblicarne una nuova basta alzarla.
# Branch sviluppo: versioni di prova tipo "0.1.8-dev1", pubblicate senza toccare "latest".
# Per provarle: in HA aggiungere il repository https://github.com/nexohm/ha-addons#sviluppo
# Pull request verso main: compila sempre (anche senza modifiche all'add-on, così i controlli
# richiesti dalla protezione di main ci sono sempre) e non pubblica nulla; fallisce se la
# versione è ancora di prova, quindi il merge resta bloccato finché non è definitiva.
name: Immagini add-on

on:
  push:
    branches: [main, sviluppo]
    paths: ["installer_agent/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { arch: amd64,   platform: linux/amd64 }
          - { arch: aarch64, platform: linux/arm64 }
          - { arch: armv7,   platform: linux/arm/v7 }
    steps:
      - uses: actions/checkout@v4
      - id: info
        run: |
          version=$(python3 -c "import yaml;print(yaml.safe_load(open('installer_agent/config.yaml'))['version'])")
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          # Le versioni di prova non devono mai arrivare ai clienti, e su sviluppo servono solo quelle
          publish=true
          [[ "$GITHUB_EVENT_NAME" == pull_request ]] && publish=false
          if [[ "$GITHUB_REF" == refs/heads/sviluppo && "$version" != *-dev* ]]; then
            # versione definitiva preparata per il merge: si compila per controllo, ma la pubblica solo main
            echo "::notice::Versione definitiva $version su sviluppo: compilo senza pubblicare (la pubblica il merge su main)"
            publish=false
          fi
          if [[ "$GITHUB_REF" != refs/heads/sviluppo && "$version" == *-dev* ]]; then
            echo "::error::La versione $version è di prova: prima del merge va impostata la versione definitiva"; exit 1
          fi
          # La versione dichiarata dall'agente deve coincidere con quella dell'add-on
          agent=$(sed -n 's/^AGENT_VERSION = "\(.*\)"/\1/p' installer_agent/agent/link.py)
          if [[ "$agent" != "$version" ]]; then
            echo "::error::AGENT_VERSION in link.py ($agent) diversa da config.yaml ($version)"; exit 1
          fi
          # Il nome "(prova)" serve solo alle versioni di prova
          name=$(python3 -c "import yaml;print(yaml.safe_load(open('installer_agent/config.yaml'))['name'])")
          if [[ "$version" != *-dev* && "$name" == *prova* ]]; then
            echo "::error::Versione definitiva con il nome di prova ($name): rimettere il nome normale"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          [[ "$version" == *-dev* ]] && echo "latest=false" >> "$GITHUB_OUTPUT" || echo "latest=true" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$owner/${{ matrix.arch }}-addon-installer_agent" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: steps.info.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: installer_agent
          platforms: ${{ matrix.platform }}
          push: ${{ steps.info.outputs.publish == 'true' }}
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:latest
          tags: |
            ${{ steps.info.outputs.image }}:${{ steps.info.outputs.version }}
            ${{ steps.info.outputs.latest == 'true' && format('{0}:latest', steps.info.outputs.image) || '' }}
          labels: |
            io.hass.name=Agente Assistenza
            io.hass.type=addon
            io.hass.version=${{ steps.info.outputs.version }}
            io.hass.arch=${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
